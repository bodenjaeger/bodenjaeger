<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bodenjäger Verlegeanfrage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
<style>
/* Mobil zuerst: eine Frage pro Bildschirm, schmale Spalte (max. 560 px), Weiter-Leiste unten fest. Shop-Werte aus globals.css; bewusst nur helles Theme wie der Shop. */
:root{
  --brand:#ed1b24; --brand-hover:#c8161e; --chip-an:#d11820;
  --dark:#2e2d32; --mid:#4c4c4c; --ash:#e5e5e5; --pale:#f9f9fb; --white:#fff; --success:#28a745;
  --font:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--pale)}
body{color:var(--dark);font-family:var(--font);font-size:16px;line-height:1.5;margin:0}
b,strong,h1,h2,h3,button,.f{font-weight:700}
.kopf{background:var(--dark);color:#fff}
.kopf-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.kopf svg{height:24px;width:auto;display:block}
.kopf .tel{font-size:13px;color:var(--ash);user-select:all}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
.leiste{display:flex;align-items:center;gap:12px;margin-bottom:14px;min-height:40px}
.zurueck{width:40px;height:40px;border-radius:8px;border:1px solid var(--ash);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--dark);flex:none;padding:0}
.zurueck:hover{border-color:var(--mid)}
.zurueck svg{width:22px;height:22px}
.fs{flex:1;min-width:0}
.fs-text{font-size:12px;color:var(--mid);display:flex;justify-content:space-between;gap:8px}
.fs-text b{color:var(--dark)}
.fs-bar{height:6px;border-radius:99px;background:var(--ash);margin-top:6px;overflow:hidden}
.fs-bar span{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.karte{background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(46,45,50,.10);padding:22px 18px}
@media(min-width:600px){.karte{padding:30px 32px}}
.kicker{margin:0 0 6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--brand)}
h1,h2{margin:0;font-size:clamp(1.35rem,5.2vw,1.75rem);line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.hinweis{margin:8px 0 0;color:var(--mid);font-size:15px}
.koerper{margin-top:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:12px 16px;border:2px solid var(--ash);border-radius:12px;background:#fff;text-align:left;font:inherit;color:var(--dark);cursor:pointer;transition:border-color .15s,background-color .15s}
.opt:hover{border-color:var(--mid)}
.opt.an{border-color:var(--brand);background:rgba(237,27,36,.05)}
.opt:focus-visible,.btn:focus-visible,.chip:focus-visible,.zurueck:focus-visible,.prod:focus-visible{outline:2px solid var(--dark);outline-offset:2px}
.opt .ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--pale);display:grid;place-items:center;color:var(--brand)}
.opt.an .ic{background:#fff}
.opt .ic svg{width:22px;height:22px}
.opt .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.opt .t b{font-size:16px}
.opt .t i{font-style:normal;font-size:13px;color:var(--mid);line-height:1.4}
.opt .preis{font-weight:700;color:var(--brand);white-space:nowrap}
.opt .badge{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--dark);color:#fff;border-radius:6px;padding:2px 7px;max-width:100%;width:fit-content}
.opt.gross{min-height:84px;align-items:flex-start}
.raster2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.raster2 .opt{min-height:64px;padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border:1px solid var(--ash);border-radius:999px;background:#fff;font:inherit;font-size:14px;cursor:pointer;color:var(--dark)}
.chip:hover{border-color:var(--mid)}
.chip.an{background:var(--chip-an);border-color:var(--chip-an);color:#fff;font-weight:700}
.feld{display:grid;gap:6px}
.feld label{font-size:14px;font-weight:700}
.feld small{font-weight:400;color:var(--mid)}
input[type=text],input[type=email],input[type=tel],input[type=number]{font:inherit;font-size:16px;width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--ash);border-radius:8px;background:#fff;color:var(--dark)}
input:focus{outline:none;box-shadow:0 0 0 3px rgba(237,27,36,.3)}
input.gross{font-size:26px;font-weight:700;letter-spacing:.12em;text-align:center}
.zwei{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fehler{color:var(--brand);font-size:14px;font-weight:700}
.fehler:empty{display:none}
.box{border:2px solid;border-radius:12px;padding:14px 16px;font-size:14px}
.box p{margin:4px 0 0;color:var(--mid)}
.box.gut{border-color:rgba(40,167,69,.3);background:rgba(40,167,69,.08)}
.box.warn{border-color:rgba(237,27,36,.3);background:rgba(237,27,36,.05)}
.box.info{border-color:var(--ash);background:var(--pale)}
.qm{display:flex;align-items:baseline;justify-content:center;gap:8px;font-variant-numeric:tabular-nums}
.qm input{width:130px;text-align:center;font-size:34px;font-weight:700;border-width:2px}
.qm span{font-size:20px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--brand)}
.zeile{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--ash)}
.zeile:first-child{border-top:0}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:40px;height:40px;border-radius:8px;border:1px solid var(--ash);background:#fff;font:inherit;font-size:20px;cursor:pointer;color:var(--dark)}
.stepper output{min-width:32px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.schalter{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
.schalter input{width:22px;height:22px;accent-color:var(--brand)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mid);cursor:pointer}
.check input{margin-top:2px;width:20px;height:20px;accent-color:var(--brand);flex:none}
.check a{color:var(--dark)}
.suche{position:relative}
.prods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prod{position:relative;border:2px solid var(--ash);border-radius:12px;background:#fff;padding:0;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:var(--dark)}
.prod.an{border-color:var(--brand)}
.prod .bild{aspect-ratio:4/3;max-width:100%}
.prod .info{padding:8px 10px;display:grid;gap:2px}
.prod .info b{font-size:13px;line-height:1.3}
.prod .info span{font-size:12px;color:var(--mid)}
.prod .nr{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;font-weight:700;display:none;place-items:center}
.prod.an .nr{display:grid}
.beispiel{font-size:12px;color:var(--mid);border-left:3px solid var(--ash);padding-left:10px}
.zaehler{font-size:14px;color:var(--mid)}
.zaehler b{color:var(--dark)}
.beleg{border:1px solid var(--ash);border-radius:12px;background:var(--pale);padding:2px 16px}
.beleg .zeile{font-variant-numeric:tabular-nums}
.ergebnis{text-align:center;padding:8px 0 4px}
.ergebnis .summe{font-size:clamp(1.9rem,8vw,2.6rem);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.ergebnis .unter{font-size:14px;color:var(--mid);margin-top:6px}
.teile{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.teil{border:1px solid var(--ash);border-radius:12px;padding:12px;background:var(--pale)}
.teil span{display:block;font-size:12px;color:var(--mid)}
.teil b{font-variant-numeric:tabular-nums;font-size:15px}
details.aufschl{border:1px solid var(--ash);border-radius:12px;padding:4px 16px;background:#fff}
details.aufschl summary{cursor:pointer;font-weight:700;padding:10px 0;font-size:14px}
details.aufschl .zeile{font-size:13px;font-variant-numeric:tabular-nums}
details.aufschl .zeile i{font-style:normal;color:var(--mid);display:block;font-size:12px}
.btn{font:inherit;font-weight:700;font-size:16px;min-height:52px;padding:12px 24px;border-radius:8px;cursor:pointer;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none}
.btn.rot{background:var(--brand);color:#fff}
.btn.rot:hover{background:var(--brand-hover)}
.btn.rahmen{background:#fff;color:var(--dark);border:1px solid var(--ash)}
.btn.rahmen:hover{border-color:var(--mid)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.unten{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--ash);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.unten-in{max-width:560px;margin:0 auto;display:grid;gap:6px}
.unten small{font-size:12px;color:var(--mid);text-align:center}
.vertrauen{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:12.5px;color:var(--mid)}
.vertrauen span{display:flex;align-items:center;gap:6px}
.vertrauen span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}
.danke-icon{width:56px;height:56px;border-radius:50%;background:var(--success);display:grid;place-items:center;margin-bottom:14px}
.danke-icon svg{width:30px;height:30px}
.liste{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.liste li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.haken{flex:none;width:22px;height:22px;border-radius:50%;background:var(--brand);display:grid;place-items:center;margin-top:1px}
.haken svg{width:13px;height:13px}
/* Vorschlagslisten (Shop-Suche, Adresse) */
.vorschlaege{display:grid;border:1px solid var(--ash);border-radius:8px;background:#fff;overflow:hidden}
.vorschlaege:empty{display:none}
.vorschlaege button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;padding:12px 14px;border:0;border-top:1px solid var(--ash);background:#fff;font:inherit;font-size:15px;color:var(--dark);cursor:pointer}
.vorschlaege button:first-child{border-top:0}
.vorschlaege button:hover,.vorschlaege button:focus-visible{background:var(--pale);outline:none}
.vorschlaege small{color:var(--mid);font-size:12px;white-space:nowrap}
.gewaehlt{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--brand);background:rgba(237,27,36,.05);border-radius:12px;padding:12px 14px}
.gewaehlt button{background:none;border:0;font:inherit;font-size:13px;color:var(--mid);text-decoration:underline;cursor:pointer;padding:4px}
/* Terminwahl */
.tage{display:grid;grid-auto-flow:column;grid-auto-columns:64px;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.tage::-webkit-scrollbar{display:none}
.tag{border:2px solid var(--ash);border-radius:12px;background:#fff;padding:8px 4px;text-align:center;font:inherit;color:var(--dark);cursor:pointer;display:grid;gap:2px}
.tag span{font-size:12px;color:var(--mid)}
.tag b{font-size:18px;font-variant-numeric:tabular-nums}
.tag small{font-size:11px;color:var(--mid)}
.tag.an{border-color:var(--brand);background:rgba(237,27,36,.05)}
.tag:focus-visible,.slot:focus-visible{outline:2px solid var(--dark);outline-offset:2px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{min-height:44px;border:1px solid var(--ash);border-radius:8px;background:#fff;font:inherit;font-size:15px;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--dark)}
.slot:hover{border-color:var(--mid)}
.slot.an{background:var(--chip-an);border-color:var(--chip-an);color:#fff;font-weight:700}
/* Team-Ansicht */
.team{margin-top:20px;border:1px dashed var(--mid);border-radius:12px;padding:16px;background:#fff}
.team h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--mid)}
.labels{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.lbl{font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;color:#fff}
.lbl.a{background:var(--success)}.lbl.b{background:#c47f00}.lbl.c{background:var(--mid)}
.lbl.weg{background:var(--dark)}.lbl.rot{background:var(--brand)}
.trello-titel{font-weight:700;margin-bottom:8px}
pre.karte-text{margin:0;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;background:var(--pale);border:1px solid var(--ash);border-radius:8px;padding:12px;overflow-x:auto}
.cl{margin:12px 0 0}
.cl b{font-size:13px}
.cl ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:13px}
.cl li::before{content:"☐ ";color:var(--mid)}
.meld{margin-top:12px;font-size:13px;display:grid;gap:4px}
/* Bewertungen (nur Start) */
.stimmen{margin-top:28px}
.stimmen h2{font-size:17px;margin-bottom:10px}
.rk-band{list-style:none;margin:0;padding:2px 2px 10px;display:grid;grid-auto-flow:column;grid-auto-columns:85%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.rk-band::-webkit-scrollbar{display:none}
@media(min-width:600px){.rk-band{grid-auto-columns:calc((100% - 12px)/2)}}
.rk{scroll-snap-align:start;background:#fff;border:1px solid var(--ash);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rk-kopf{display:flex;align-items:center;gap:10px}
.rk-av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.rk-name{display:flex;flex-direction:column;min-width:0;flex:1;font-size:14px;line-height:1.3}
.rk .sterne{color:#fbbc05;letter-spacing:2px;font-size:13px}
.rk .g{flex:none;width:18px;height:18px}
.rk p{margin:0;font-size:14px;line-height:1.5}
@media(prefers-reduced-motion:no-preference){.karte{animation:rein .22s ease-out}@keyframes rein{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

<template id="tpl-stimmen">
  <section class="stimmen" aria-labelledby="st-t"><h2 id="st-t">Das sagen Kunden über unseren Verlegeservice</h2><ul class="rk-band" tabindex="0"><li class="rk"><div class="rk-kopf"><span class="rk-av" aria-hidden="true">P</span><span class="rk-name"><b>Petra H.</b><span class="sterne" aria-label="5 von 5 Sternen">★★★★★</span></span><svg class="g" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.8 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.3V7.1H2.1a11 11 0 0 0 0 9.9l3.7-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg></div><p>Nach fachkundiger Beratung vor Ort bei Bodenjäger haben wir uns für einen Laminatboden entschieden. Wir haben trotz bevorstehender Weihnachtsfeiertage einen Termin zum Ausmessen bekommen und noch vor Jahreswechsel wurde der Boden fachmännisch verlegt. Wir sind sehr zufrieden. Die Mitarbeiter vom Bodenjäger haben sauber und korrekt gearbeitet. Wir würden jederzeit wieder bei Bodenjäger kaufen.</p></li><li class="rk"><div class="rk-kopf"><span class="rk-av" aria-hidden="true">M</span><span class="rk-name"><b>Maike Siebenhaar</b><span class="sterne" aria-label="5 von 5 Sternen">★★★★★</span></span><svg class="g" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.8 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.3V7.1H2.1a11 11 0 0 0 0 9.9l3.7-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg></div><p>Wir sind super zufrieden! Der Boden wurde trotz schiefer Wände absolut sauber und professionell verlegt. Die Beratung war kompetent und freundlich – man hat sich viel Zeit für uns genommen.</p></li><li class="rk"><div class="rk-kopf"><span class="rk-av" aria-hidden="true">G</span><span class="rk-name"><b>Guido</b><span class="sterne" aria-label="5 von 5 Sternen">★★★★★</span></span><svg class="g" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.8 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.3V7.1H2.1a11 11 0 0 0 0 9.9l3.7-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg></div><p>Ich bin absolut begeistert von der Arbeit der Firma Bodenjäger! Vom ersten Kontakt bis zur Fertigstellung lief alles professionell, zuverlässig und freundlich ab. Ein ganz besonderes Lob geht an den Bodenleger Daniel: Er hat hervorragende Arbeit geleistet! Die Verlegung meines Klickvinylbodens wurde mit höchster Präzision, Sorgfalt und handwerklichem Können durchgeführt.</p></li><li class="rk"><div class="rk-kopf"><span class="rk-av" aria-hidden="true">R</span><span class="rk-name"><b>Rolf Preuth</b><span class="sterne" aria-label="5 von 5 Sternen">★★★★★</span></span><svg class="g" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.8 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.3V7.1H2.1a11 11 0 0 0 0 9.9l3.7-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg></div><p>Sehr kompetente Firma const eurGenau=n=>n.toLocaleString('de-DE',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2})+' €';
const runden=(n,auf)=>auf?Math.ceil(n/50)*50:Math.floor(n/50)*50;

function lage(){
  const e=PLZ[st.plz]; if(!/^\d{5}$/.test(st.plz)) return null;
  // Im Entwurf kennt die Tabelle nur PLZ bis 60 km — alles andere liegt sicher außerhalb.
  if(!e) return {bekannt:true,ort:'Dein Ort',luft:999,fahrt:999,imGebiet:false,kreis:KREISE[4]};
  const fahrt=Math.round(e[1]*UMWEG);
  return {bekannt:true,ort:e[0],luft:e[1],fahrt,imGebiet:fahrt<=MAX_FAHRT_KM,kreis:KREISE.find(k=>e[1]<=k.bis)};
}
function aktuellerPfad(){
  if(!st.weg) return ['plz','weg'];
  let p=[...PFADE[st.weg]];
  // Schon bei uns ausgesucht: Boden eintippen statt Bodenart wählen; mit Produkt entfällt die Preisklasse
  if(st.besitz==='bj'){ p=p.map(x=>x==='bodenart'?'produkt':x); if(st.produkt) p=p.filter(x=>x!=='klasse'); }
  if(st.weg==='beratung'&&st.beratung==='fachmarkt') p.splice(p.indexOf('beratungsart')+1,0,'termin');
  return p;
}

// ─────────────────────────────────────────────────────────────────────────────
// Preisrahmen nach Montageliste
// ─────────────────────────────────────────────────────────────────────────────
function preisrahmen(){
  const v=VERLEGUNG[st.bodenart], m2=st.flaeche, l=lage();
  const stufe=m2<40?0:m2<80?1:2;
  const posten=[];
  const add=(name,min,max,info)=>posten.push({name,min,max,info});
  add(`${v.name} verlegen (${m2} m²)`, v.min[stufe]*m2, v.max[stufe]*m2, v.min[stufe]===v.max[stufe]?`${eurGenau(v.min[stufe])}/m², Artikel ${v.art}`:`${eurGenau(v.min[stufe])}–${eurGenau(v.max[stufe])}/m² (lose bis verklebt)`);
  if(m2<15) add('Mindermenge unter 15 m²',MINDERMENGE,MINDERMENGE,'Pauschale');
  const ab=ALTBODEN[st.altboden];
  const hatAlt=st.altboden&&st.altboden!=='keiner';
  if(ab&&ab.preis){ const p=(ab.preis+ENTSORGEN)*m2; add(`Altboden entfernen und entsorgen`,p,p,`${eurGenau(ab.preis)} + ${eurGenau(ENTSORGEN)} je m²`); }
  // Untergrund: Spanne, weil er erst beim Aufmaß sichtbar ist
  const sp3=m2<50?10:8, sp6=m2<50?12:10;
  if(v.verklebt===true) add('Untergrund grundieren und spachteln',(1.80+sp3)*m2,(3.80+sp6)*m2,'je nach Zustand, nach Aufmaß');
  else if(v.verklebt==='teils') add('Untergrund vorbereiten',0,(3.80+sp6)*m2,'nötig bei verklebter Verlegung');
  else add('Untergrund vorbereiten',0,(3.50+sp3)*m2,'falls nötig: Dampfbremse, spachteln');
  if(st.sockel){ const lfm=m2; add(`Sockelleisten montieren (ca. ${lfm} lfm)`,SOCKEL_MONTAGE[0]*lfm+(hatAlt?SOCKEL_ENTFERNEN*lfm:0),SOCKEL_MONTAGE[1]*lfm+(hatAlt?SOCKEL_ENTFERNEN*lfm:0),'Faustregel: lfm ≈ m², Leisten-Material separat'); }
  if(st.stufen>0){
    if(v.treppe) add(`Treppe (${st.stufen} Stufen)`,v.treppe[0]*st.stufen,(v.treppe[1]+(hatAlt?TREPPE_ALT:0))*st.stufen,'gerade bis gewendelt');
    else add(`Treppe (${st.stufen} Stufen)`,0,0,'Preis nach Aufmaß');
  }
  if(st.tueren>0) add(`Türen kürzen (${st.tueren})`,TUER*st.tueren,TUER*st.tueren,`${TUER} € je Tür`);
  const k=l&&l.kreis; let bMax=k.baustelle;
  if(k.name==='über Kreis 4') bMax+=Math.max(0,(l.fahrt-26))*3;
  add(`Baustellenpauschale (${k.name})`,k.baustelle,bMax,k.name==='über Kreis 4'?'zzgl. Anfahrt ab Kreis 4':'Anfahrt und Einrichtung');
  const vMin=posten.reduce((s,p)=>s+p.min,0), vMax=posten.reduce((s,p)=>s+p.max,0);
  const klasse=st.produkt?null:(st.klasse==='empfehlung'?'mittel':st.klasse);
  const mp=st.produkt?[st.produkt.preis,st.produkt.preis]:MATERIAL[st.bodenart][klasse];
  const mMin=mp[0]*m2*1.05, mMax=mp[1]*m2*1.10;
  const offen=[];
  if(ab&&ab.preis===null) offen.push(st.altboden==='unklar'?'Ob und wie der alte Boden entfernt wird, klären wir beim Aufmaß.':`${ab.name} entfernen ist nicht enthalten, das klären wir beim Aufmaß.`);
  if(st.stufen>0&&!v.treppe) offen.push('Die Treppe ist nicht enthalten, den Preis nennen wir dir nach dem Aufmaß.');
  return {posten,vMin:runden(vMin,false),vMax:runden(vMax,true),mMin:runden(mMin,false),mMax:runden(mMax,true),
    gMin:runden(vMin+mMin,false),gMax:runden(vMax+mMax,true),klasse,offen,mp};
}

// ─────────────────────────────────────────────────────────────────────────────
// Lead-Stufe A/B/C (fürs Trello-Label) und Meldung an Meta/Google
// ─────────────────────────────────────────────────────────────────────────────
function leadStufe(){
  const l=lage();
  if(st.weg==='aufmass') return 'A';
  let p=0;
  if(l&&l.imGebiet) p+= l.kreis.name==='über Kreis 4'?1:2;
  if(['asap','1-3'].includes(st.zeitraum)) p+=2; else if(st.zeitraum==='3-6') p+=1;
  if(st.weg==='preis'&&st.flaeche>=25) p+=1;
  if(st.telefon.replace(/\D/g,'').length>=6) p+=1;
  if(st.besitz==='bj') p+=1;
  if(st.beratung==='fachmarkt') p+=2;
  return p>=5?'A':p>=3?'B':'C';
}

// Beratungstermine zu den Öffnungszeiten: Mo–Fr 9–18:30, Sa 9–14 (letzter Start 30 Min. vor Schluss)
const WT=['So','Mo','Di','Mi','Do','Fr','Sa'];
function termintage(){
  const tage=[],d=new Date();d.setHours(0,0,0,0);
  while(tage.length<12){d.setDate(d.getDate()+1);if(d.getDay()!==0)tage.push(new Date(d));}
  return tage;
}
function slots(tag){
  const ende=tag.getDay()===6?13.5:18; const out=[];
  for(let h=9;h<=ende;h+=0.5) out.push(`${String(Math.floor(h)).padStart(2,'0')}:${h%1?'30':'00'}`);
  return out;
}
const tagKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function terminText(){
  if(!st.termin) return '';
  const [datum,zeit]=st.termin.split('T');const d=new Date(datum+'T00:00');
  return `${WT[d.getDay()]}, ${d.getDate()}.${d.getMonth()+1}. um ${zeit} Uhr`;
}
function produktVorschlaege(){
  const q=st.produktText.trim().toLowerCase(); if(q.length<2) return '';
  const w=q.split(/\s+/);
  return SHOP_BEISPIELE.filter(p=>w.every(x=>p.name.toLowerCase().includes(x))).slice(0,6)
    .map(p=>`<button type="button" data-produkt="${esc(p.name)}"><span>${esc(p.name)}</span><small>${p.preis.toLocaleString('de-DE')} €/m²</small></button>`).join('');
}
function adressVorschlaege(){
  const q=st.strasse.trim().toLowerCase(); const l=lage(); if(q.length<2||st.strasseOk) return '';
  return STRASSEN.filter(x=>x.toLowerCase().startsWith(q)).slice(0,5)
    .map(x=>`<button type="button" data-adr="${esc(x)}"><span>${esc(x)}</span><small>${st.plz} ${esc(l.ort)}</small></button>`).join('');
}

        if(st.beratung==='fachmarkt') s+=`${f('email','E-Mail','email','email',st.email)}${f('telefon','Telefon','tel','tel',st.telefon,1)}`;
        else s+=f('telefon',st.beratung==='whatsapp'?'Handynummer (WhatsApp)':'Telefon','tel','tel',st.telefon);

      return s;},

      if(st.vorname.trim().length<2) e.vorname='Bitte gib deinen Vornamen ein.';

      if((telPflicht||st.telefon.trim())&&(tel.length<6||!/^(\+|0)/.test(st.telefon.trim()))) e.telefon='Bitte prüfe die Telefonnummer (z. B. 0170 1234567).';
      if((st.weg!=='beratung'||st.beratung==='fachmarkt')&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(st.email.trim())) e.email='Bitte prüfe deine E-Mail-Adresse.';
      if(!st.datenschutz) e.datenschutz='Bitte stimme zu, damit wir dich kontaktieren dürfen.';
      return e;},

    hinweis:'Nach der Zahlung rufen wir dich an und vereinbaren den Termin.',

      return `<div class="beleg">

        <div class="zeile" style="font-size:14px"><span>Dein Wunschboden als Original-Dielen</span><span>${st.wunsch.length+(st.empfehlung?1:0)+(st.produkt?1:0)}×</span></div>
        <div class="zeile" style="font-size:14px;color:var(--success)"><span>Gutschrift bei Beauftragung</span><span>vollständig</span></div>
        <div class="zeile"><span>Jetzt zu zahlen <small style="color:var(--mid)">inkl. MwSt.</small></span><b>${eur(l.kreis.aufmass)}</b></div></div>
        <p style="margin:0;font-size:13px;color:var(--mid)">Kostenlos absagen oder verschieben bis 24 Stunden vor dem Termin.</p>
        <div class="feld"><label for="strasse">Adresse für das Aufmaß</label>${st.strasseOk?`<div class="gewaehlt"><span><b>${esc(st.strasse)}</b><br><span style="font-size:13px;color:var(--mid)">${st.plz} ${esc(l.ort)}</span></span><button type="button" data-aktion="adresse-weg">Ändern</button></div>`:`<input type="text" id="strasse" autocomplete="off" placeholder="Straße eintippen" value="${esc(st.strasse)}"><div class="vorschlaege" id="adr-vorschlaege">${adressVorschlaege()}</div>`}<div class="fehler" id="f-strasse"></div></div>
        ${st.strasseOk?`<div class="feld" style="max-width:180px"><label for="hausnr">Hausnummer</label><input type="text" id="hausnr" autocomplete="off" value="${esc(st.hausnr)}"><div class="fehler" id="f-hausnr"></div></div>`:''}
        <p class="beispiel">Entwurf: Im Shop kommen die Vorschläge von Google und nur Adressen aus deiner PLZ sind wählbar. Probier z. B. „Ha“.</p>

function ergebnisPreis(){
  const r=preisrahmen(),v=VERLEGUNG[st.bodenart],l=lage();
  const boden=st.produkt?st.produkt.name:`${v.name} (${KLASSEN[st.klasse]})`;
  const enthalten=[`Boden: ${boden}`,`Verlegung von ca. ${st.flaeche} m²`];
  const ab=ALTBODEN[st.altboden];
  if(ab&&ab.preis) enthalten.push('Alten Boden entfernen und entsorgen');
  enthalten.push('Untergrund vorbereiten, falls nötig');
  if(st.sockel) enthalten.push('Sockelleisten montieren');
  if(st.stufen>0&&v.treppe) enthalten.push(`Treppe mit ${st.stufen} Stufen`);
  if(st.tueren>0) enthalten.push(`${st.tueren} ${st.tueren===1?'Tür':'Türen'} kürzen`);
  enthalten.push('Anfahrt und Baustelleneinrichtung');
  const hinweise=[...r.offen];
  if(st.sockel) hinweise.push('Die Sockelleisten selbst suchst du dir beim Aufmaß aus.');
  hinweise.push('Wie viel am Untergrund zu tun ist, sehen wir erst vor Ort. Dein genaues Angebot bekommst du nach dem Aufmaß.');
  return `<p class="kicker">Dein Preisrahmen</p><h1>Hallo ${esc(st.vorname)}, so viel kostet dein neuer Boden ungefähr</h1>
  <div class="ergebnis"><div class="summe">${eur(r.gMin)} – ${eur(r.gMax)}</div><div class="unter">komplett mit Boden und Verlegung, inkl. MwSt.</div></div>
  <div class="box info"><b>Darin enthalten</b><ul class="liste" style="margin-top:8px">${enthalten.map(x=>`<li><span class="haken">${HAKEN}</span><span>${esc(x)}</span></li>`).join('')}</ul></div>
  <p style="margin:0;font-size:13px;color:var(--mid)">${hinweise.map(esc).join(' ')}</p>
  <button type="button" class="btn rot" data-aktion="zum-aufmass">Aufmaß mit Wunschboden buchen · ${eur(l.kreis.aufmass)}</button>
  <p style="margin:-4px 0 0;font-size:12px;color:var(--mid);text-align:center">Wird bei Beauftragung vollständig gutgeschrieben</p>
  <button type="button" class="btn rahmen" data-aktion="zur-beratung">Lieber erst im Fachmarkt beraten lassen</button>`;
}
function danke(){
  const l=lage();
  if(st.weg==='aufmass') return `<div class="danke-icon">${HAKEN}</div><h1>Danke, ${esc(st.vorname)}! Dein Aufmaß ist bezahlt.</h1>
    <p class="hinweis">Wir rufen dich an und vereinbaren deinen Termin. Die Zahlungsbestätigung kommt per E-Mail.</p>
    <ul class="liste"><li><span class="haken">${HAKEN}</span><span>Wir bringen <b>${esc([st.produkt?st.produkt.name:null,...st.wunsch,st.empfehlung?'unsere Empfehlung':null].filter(Boolean).join(', '))}</b> als Original-Dielen mit.</span></li>
    <li><span class="haken">${HAKEN}</span><span>Vor Ort messen wir aus und prüfen Untergrund, Türen und Übergänge.</span></li>
    <li><span class="haken">${HAKEN}</span><span>Du bekommst dein genaues Angebot. Bei Beauftragung schreiben wir dir ${eur(l.kreis.aufmass)} gut.</span></li></ul>`;
  const t={telefon:['Wir rufen dich an.','Ein Berater aus unserem Fachmarkt meldet sich zu deiner Wunschzeit.'],
    fachmarkt:['Dein Termin steht.',`Wir erwarten dich am ${terminText()} im Fachmarkt. Sag bei uns einfach kurz, dass du einen Beratungstermin hast. Die Bestätigung kommt per E-Mail.`],
    whatsapp:['Wir schreiben dir per WhatsApp.','Schick uns gern schon Fotos von deinen Räumen, dann können wir dich noch besser beraten.']}[st.beratung];
  return `<div class="danke-icon">${HAKEN}</div><h1>Danke, ${esc(st.vorname)}! ${t[0]}</h1><p class="hinweis">${t[1]}</p>
    <div class="box info"><b>Fachmarkt Hückelhoven</b><p>Neckarstraße 9 · Mo–Fr 9–18:30 Uhr, Sa 9–14 Uhr</p></div>`;
}

function teamAnsicht(){
  const l=lage(),stufe=leadStufe(),weg=st.weg;
  const ab=st.altboden?ALTBODEN[st.altboden].name:null;
  const titel=`${weg==='beratung'&&st.beratung==='fachmarkt'?'📅 '+terminText()+' – ':''}${st.vorname} ${st.nachname} – ${l.ort} (${st.plz}) – ${WEG_NAME[weg]}`;
  const zeilen=[`**KONTAKT** ${st.vorname} ${st.nachname}`.trim(),`Tel: ${st.telefon||'–'} · E-Mail: ${st.email||'–'}`,`${st.plz} ${l.ort}${st.strasseOk?', '+st.strasse+' '+st.hausnr:''} · ca. ${l.fahrt} km Fahrweg · ${l.kreis.name}`,'',`**WEG** ${WEG_NAME[weg]}`];
  if(st.besitz) zeilen.push(`Boden schon? ${({nein:'Nein',bj:'Bei Bodenjäger ausgesucht',fremd:'Woanders gekauft – Hinweis gezeigt, will bei uns aussuchen'})[st.besitz]}`);
  if(st.bodenart) zeilen.push(`Bodenart: ${VERLEGUNG[st.bodenart].name} · Fläche: ${st.flaeche} m²`);
  if(ab) zeilen.push(`Altboden: ${ab}`);
  if(st.produkt||st.produktText) zeilen.push(`Ausgesuchter Boden: ${st.produkt?st.produkt.name:st.produktText+' (frei eingegeben)'}`);
  if(weg==='preis'){const r=preisrahmen();zeilen.push(`Extras: ${[st.sockel?'Sockelleisten':null,st.stufen?st.stufen+' Stufen':null,st.tueren?st.tueren+' Türen':null].filter(Boolean).join(', ')||'–'}`,st.produkt?null:`Preisklasse: ${KLASSEN[st.klasse]}`,`Genannter Preisrahmen: ${eur(r.gMin)} – ${eur(r.gMax)}`,'',`**KALKULATION (intern, nicht für den Kunden)**`,...r.posten.map(p=>`${p.name}: ${p.min===p.max?eur(p.min):eur(p.min)+' – '+eur(p.max)}`),`Boden: ${eur(r.mMin)} – ${eur(r.mMax)}`);}
  if(st.zeitraum) zeilen.push(`Zeitraum: ${({asap:'So schnell wie möglich','1-3':'1–3 Monate','3-6':'3–6 Monate',offen:'Noch offen'})[st.zeitraum]}`);
  if(weg==='aufmass') zeilen.push(`Wunschböden: ${[st.produkt?st.produkt.name:null,...st.wunsch,st.empfehlung?'+ Empfehlung':null].filter(Boolean).join(', ')}`,`BEZAHLT: ${eur(l.kreis.aufmass)} – Artikel ${l.kreis.aufmassArt} – ${({paypal:'PayPal',karte:'Karte',klarna:'Klarna'})[st.zahlart]}`);
  if(weg==='beratung') zeilen.push(`Beratung: ${({telefon:'Rückruf',fachmarkt:'Termin im Fachmarkt',whatsapp:'WhatsApp'})[st.beratung]}${st.rueckruf&&st.beratung==='telefon'?' · '+st.rueckruf:''}${st.beratung==='fachmarkt'?' · '+terminText():''}`);
  zeilen.push('',`**QUELLE** ${st.quelle}`);

  let liste='',plan='';
  if(weg==='beratung'&&st.beratung==='fachmarkt') liste=['Kunde kommt am '+terminText()+' → Karte öffnen','Passende Böden bereitlegen','Bodenart / Wunsch?','Räume und ca. m²?','Was liegt aktuell? Entfernen?','Treppe? Türen?','Wann soll verlegt werden? (ab KW '+VERLEGE_AB_KW+')','Nächster Schritt: Aufmaß gebucht / später'];
  else if(weg==='beratung') liste=['Bodenart / Wunsch?','Räume und ca. m²?','Was liegt aktuell? Entfernen?','Treppe? Türen?','Wann soll verlegt werden? (ab KW '+VERLEGE_AB_KW+')','Budget-Rahmen?','Boden schon gesehen? Fachmarkt oder Musterbox anbieten','Nächster Schritt: Aufmaß gebucht / Fachmarkttermin / später'];
  if(weg==='aufmass') liste=['Termin vereinbaren','Dielen einpacken: '+[st.produkt?st.produkt.name:null,...st.wunsch,st.empfehlung?'Empfehlung':null].filter(Boolean).join(', '),'Aufmaß durchführen','Angebot in SAP erstellen (A000x gutschreiben)'];
  if(weg==='preis'){ liste=['Preisrahmen-Mail ist raus (automatisch)']; if(stufe!=='C') liste.push('Tag 2: anrufen und Aufmaß anbieten');
    plan=['Sofort: Mail mit Preisrahmen und Link „Aufmaß buchen“',stufe!=='C'?'Tag 2: Anruf (Lead-Stufe '+stufe+')':'Kein Anruf (Lead-Stufe C)','Tag 3: Mail „Boden in echt sehen“ – Fachmarkt oder Musterbox','Tag 7: Mail Erinnerung Aufmaß','Tag 14: ohne Reaktion → Liste „Später“']; }

  const meld = weg==='aufmass'
    ? [`Meta + Google: Kauf „Aufmaß gebucht“ mit Wert ${eur(l.kreis.aufmass)} (Optimierungsziel)`,'Zusätzlich: Anfrage (Lead)']
    : [`Meta + Google: Anfrage (Lead) mit Wert ${({A:3,B:2,C:1})[stufe]} · Weg: ${WEG_NAME[weg]}`, st.beratung==='fachmarkt'?'Zusätzlich: „Termin im Fachmarkt gebucht“ (Schedule)':null].filter(Boolean);

  return `<div class="team"><h3>Team-Ansicht (Trello)</h3>
    <div class="labels"><span class="lbl ${stufe.toLowerCase()}">Lead-Stufe ${stufe}</span><span class="lbl weg">${WEG_NAME[weg]}</span>${weg==='beratung'&&st.beratung==='fachmarkt'?'<span class="lbl rot">Termin Fachmarkt</span>':''}${weg==='aufmass'?'<span class="lbl rot">Aufmaß bezahlt</span>':''}</div>
    <div class="trello-titel">${esc(titel)}</div>
    <div style="font-size:13px;color:var(--mid);margin-bottom:8px">Liste: ${weg==='aufmass'?'Aufmaß bezahlt – Termin vereinbaren':st.beratung==='fachmarkt'?'Termin vereinbart':'Neu'}${st.beratung==='fachmarkt'&&weg==='beratung'?` · Fälligkeitsdatum: ${terminText()}`:''}</div>
    <pre class="karte-text">${esc(zeilen.join('\n'))}</pre>
    <div class="cl"><b>Checkliste${weg==='beratung'?(st.beratung==='fachmarkt'?' für die Beratung im Fachmarkt':' fürs Gespräch'):''}</b><ul>${liste.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    ${plan?`<div class="cl"><b>Automatisches Nachfassen</b><ul>${plan.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    <div class="meld">${meld.map(x=>`<span>📊 ${esc(x)}</span>`).join('')}</div>
    <button type="button" class="btn rahmen" style="margin-top:14px" data-aktion="neu">Neue Anfrage durchspielen</button></div>`;

const karte=document.getElementById('karte'),extra=document.getElementById('extra'),unten=document.getElementById('unten'),weiterBtn=document.getElementById('weiter');
const wert=v=>typeof v==='function'?v():v;
let modus='frage'; // frage | ergebnis | danke

function render(){
  const id=verlauf[verlauf.length-1];
  const pfad=aktuellerPfad();
  const pos=pfad.indexOf(id)+1;
  document.getElementById('zurueck').style.visibility=(verlauf.length>1||modus!=='frage')&&modus!=='danke'?'visible':'hidden';
  if(modus!=='frage'){
    document.getElementById('fs-text').innerHTML='<b>Fertig</b>';document.getElementById('fs-weg').textContent=WEG_NAME[st.weg]||'';
    document.getElementById('fs-bar').style.width='100%';
    karte.innerHTML=`<div class="koerper" style="margin-top:0">${modus==='ergebnis'?ergebnisPreis():danke()}</div>`;
    extra.innerHTML=teamAnsicht();unten.hidden=true;window.scrollTo({top:0,behavior:'smooth'});return;
  }
  const s=SCREENS[id];
  document.getElementById('fs-text').innerHTML=st.weg?`Schritt <b>${pos}</b> von ${pfad.length}`:`Schritt <b>${pos}</b>`;
  document.getElementById('fs-weg').textContent=st.weg?WEG_NAME[st.weg]:'';
  document.getElementById('fs-bar').style.width=(st.weg?pos/(pfad.length+1)*100:pos*8)+'%';
  const kicker=wert(s.kicker), hinweis=wert(s.hinweis);
  karte.innerHTML=`${kicker?`<p class="kicker">${kicker}</p>`:''}<h${id==='plz'?1:2}>${wert(s.titel)}</h${id==='plz'?1:2}>${hinweis?`<p class="hinweis">${hinweis}</p>`:''}<div class="koerper">${s.body()}</div>`;
  extra.innerHTML=id==='plz'?document.getElementById('tpl-stimmen').innerHTML:'';
  const zeigeBtn=!s.auto||(s.autoWenn&&!s.autoWenn());
  unten.hidden=!zeigeBtn;
  weiterBtn.textContent=wert(s.btn)||'Weiter';
  weiterBtn.disabled=!s.weiter();
  document.getElementById('unten-hinweis').textContent=wert(s.unten)||'';
  document.getElementById('unten-hinweis').hidden=!wert(s.unten);
  // Fokus aufs erste Eingabefeld (nicht am Handy aufspringen lassen bei Kacheln)
  const erstes=karte.querySelector('input[type=text],input[type=email],input[type=tel]');
  if(erstes&&id!=='zahlung'&&!erstes.value) setTimeout(()=>erstes.focus({preventScroll:true}),50);
}

function weiter(){
  const id=verlauf[verlauf.length-1], s=SCREENS[id];
  if(!s.weiter()) return;
  if(s.pruefe){const e=s.pruefe();karte.querySelectorAll('.fehler').forEach(f=>f.textContent='');Object.entries(e).forEach(([k,m])=>{const f=document.getElementById('f-'+k);if(f)f.textContent=m;});
    if(Object.keys(e).length){const f=karte.querySelector('.fehler:not(:empty)');f&&f.scrollIntoView({behavior:'smooth',block:'center'});return;}}
  const pfad=aktuellerPfad(), i=pfad.indexOf(id);
  if(i===pfad.length-1){ modus=st.weg==='preis'?'ergebnis':'danke'; render(); return; }
  verlauf.push(pfad[i+1]); render(); window.scrollTo({top:0,behavior:'smooth'});
}
function zurueck(){
  if(modus!=='frage'){modus='frage';render();return;}
  if(verlauf.length>1){verlauf.pop();render();}
}

// Eingaben
karte.addEventListener('click',e=>{
  const o=e.target.closest('[data-key]');
  if(o&&!o.disabled){const k=o.dataset.key,v=o.dataset.val;
    if(k==='weg'&&st.weg!==v){ st.weg=v; }
    else if(k==='beratung'&&st.beratung!==v){ st.beratung=v; st.termin=null; }
    else if(k==='besitz'&&st.besitz!==v){ st.besitz=v; st.produkt=null; st.produktText=''; }
    else st[k]=v;
    const id=verlauf[verlauf.length-1],s=SCREENS[id];
    render();
    if(s&&s.auto&&(!s.autoWenn||s.autoWenn())&&o.classList.contains('opt')) setTimeout(weiter,180);
    if(k==='bodenart'&&id==='produkt'){const n=document.getElementById('produkt-suche');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}}
    return;}
  const q=e.target.closest('[data-qm]'); if(q){st.flaeche=+q.dataset.qm;render();return;}
  const sp=e.target.closest('[data-step]'); if(sp){const k=sp.dataset.step;st[k]=Math.max(0,Math.min(40,st[k]+ +sp.dataset.d));render();return;}
  const w=e.target.closest('[data-wunsch]'); if(w){const n=w.dataset.wunsch,i=st.wunsch.indexOf(n);if(i>-1)st.wunsch.splice(i,1);else if(st.wunsch.length<(st.produkt?2:3))st.wunsch.push(n);render();return;}
  const tg=e.target.closest('[data-tag]'); if(tg){st.terminTag=tg.dataset.tag;render();return;}
  const sl=e.target.closest('[data-slot]'); if(sl){st.termin=sl.dataset.slot;render();return;}
  const pr=e.target.closest('[data-produkt]'); if(pr){st.produkt=SHOP_BEISPIELE.find(x=>x.name===pr.dataset.produkt);st.bodenart=st.produkt.art;render();setTimeout(weiter,250);return;}
  const ad=e.target.closest('[data-adr]'); if(ad){st.strasse=ad.dataset.adr;st.strasseOk=true;render();setTimeout(()=>document.getElementById('hausnr')?.focus(),50);return;}
  const a=e.target.closest('[data-aktion]'); if(a) aktion(a.dataset.aktion);
});
extra.addEventListener('click',e=>{const a=e.target.closest('[data-aktion]');if(a)aktion(a.dataset.aktion);});
function aktion(was){
  if(was==='zum-aufmass'){ // Umstieg mit allen Angaben: nur noch Wunschboden, Name, Zahlung
    st.weg='aufmass';modus='frage';const pf=aktuellerPfad();verlauf=pf.slice(0,pf.indexOf('wunschboden')+1);render();window.scrollTo({top:0,behavior:'smooth'});}
  if(was==='zur-beratung'){st.weg='beratung';st.beratung='fachmarkt';modus='frage';verlauf=['plz','weg','besitz','beratungsart','termin'];render();window.scrollTo({top:0,behavior:'smooth'});}
  if(was==='produkt-weg'){st.produkt=null;st.bodenart=null;render();return;}
  if(was==='adresse-weg'){st.strasseOk=false;st.hausnr='';render();return;}
  if(was==='neu'){st={...LEER,wunsch:[]};verlauf=['plz'];modus='frage';render();window.scrollTo({top:0});}
}
karte.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='plz'){t.value=t.value.replace(/\D/g,'').slice(0,5);st.plz=t.value;
    if(st.weg){const l=lage();if(l&&l.bekannt&&!l.imGebiet&&st.weg!=='beratung')st.weg=null;}
    const pos=t.selectionStart;render();const n=document.getElementById('plz');n.focus();n.setSelectionRange(pos,pos);
    if(st.plz.length===5&&lage()?.bekannt) setTimeout(()=>{if(verlauf[verlauf.length-1]==='plz')weiter();},700);
    return;}
  if(t.id==='qm'){st.flaeche=Math.max(0,Math.min(400,+t.value||0));document.getElementById('qm-r').value=Math.min(200,st.flaeche);weiterBtn.disabled=!SCREENS.flaeche.weiter();return;}
  if(t.id==='qm-r'){st.flaeche=+t.value;document.getElementById('qm').value=st.flaeche;karte.querySelectorAll('[data-qm]').forEach(c=>c.classList.toggle('an',+c.dataset.qm===st.flaeche));return;}
  if(t.id==='produkt-suche'){st.produktText=t.value;const v=document.getElementById('produkt-vorschlaege');if(v)v.innerHTML=produktVorschlaege();
    const hatChips=!!karte.querySelector('[data-key="bodenart"]');if((st.produktText.trim().length>=3)!==hatChips){const pos=t.selectionStart;render();const n=document.getElementById('produkt-suche');n.focus();n.setSelectionRange(pos,pos);}
    weiterBtn.disabled=!SCREENS.produkt.weiter();return;}
  if(t.id==='strasse'){st.strasse=t.value;st.strasseOk=false;const v=document.getElementById('adr-vorschlaege');if(v)v.innerHTML=adressVorschlaege();const f=document.getElementById('f-strasse');if(f)f.textContent='';return;}
  if(['vorname','nachname','telefon','email','hausnr'].includes(t.id)){st[t.id]=t.value;const f=document.getElementById('f-'+t.id);if(f)f.textContent='';return;}
});
karte.addEventListener('change',e=>{const t=e.target;
  if(['datenschutz','widerruf','empfehlung','sockel'].includes(t.id)){st[t.id]=t.checked;const f=document.getElementById('f-'+t.id);if(f)f.textContent='';
    if(t.id==='empfehlung'){weiterBtn.disabled=!SCREENS.wunschboden.weiter();weiterBtn.textContent=wert(SCREENS.wunschboden.btn);}}
});
weiterBtn.addEventListener('click',weiter);
document.getElementById('zurueck').addEventListener('click',zurueck);
render();
})();
</script>

</body>
</html>
